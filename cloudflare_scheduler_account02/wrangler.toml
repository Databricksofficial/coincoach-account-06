name = "coincoach-square-scheduler-account02"
main = "src/index.js"
compatibility_date = "2026-07-30"

[triggers]

# Four UTC triggers per hour. A 0–120 second delay creates windows centered
# around minutes 07, 22, 37 and 52 while preserving four slots per hour.

crons = ["6,21,36,51 * * * *"]

[vars]
GITHUB_OWNER = "Bitcoincryptoguru"
GITHUB_REPO = "coincoach-account-02"
GITHUB_WORKFLOW = "live-square-96-per-day.yml"
GITHUB_REF = "main"
JITTER_MAX_SECONDS = "120"

